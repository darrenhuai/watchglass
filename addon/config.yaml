name: watchglass
version: "0.1.6"
slug: watchglass
description: Watch a region of any camera or stream and get notified when its text or pixels change
url: https://github.com/darrenhuai/watchglass
# The Supervisor only permits aarch64 and amd64 add-ons. The image itself
# is also published for linux/arm/v7, for the plain Docker route.
arch: [amd64, aarch64]
webui: http://[HOST]:[PORT:8080]
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Web UI
map:
  - addon_config:rw
# The Supervisor pulls image:<version>, so version above must match a tag
# the publish-image workflow has pushed (it tags each vX.Y.Z release).
image: ghcr.io/darrenhuai/watchglass
