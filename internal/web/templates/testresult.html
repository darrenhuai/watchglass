<figure class="crop-frame">
  <img src="{{.Crop}}" alt="preprocessed crop">
</figure>
{{if .Note}}<p class="muted note">{{.Note}}</p>{{end}}
{{if .Text}}<p class="ocr-line">Read: <strong class="mono">{{.Text}}</strong></p>{{end}}
{{if .Words}}
<p class="word-list">
{{range .Words}}
  <span class="word-chip {{if lt .Conf 60.0}}conf-low{{else}}conf-ok{{end}}" title="confidence {{.Conf}}">{{.Text}} ({{.Conf}})</span>
{{end}}
</p>
{{end}}
