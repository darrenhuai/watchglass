{{/* One test of the region, inserted into #test-result by app.js. The
     answer (the verdict) comes before the evidence (crop, reading). app.js
     marks the panel stale when the region or a setting the test used
     changes, and the × clears it. No <style>/<script> in here. */}}
<section class="test-panel" aria-labelledby="test-title">
  <div class="test-head">
    <div class="test-head-text">
    <h2 id="test-title" class="test-title">Test result</h2>
    <p class="test-meta mono">{{with .Engine}}<span>{{.}}</span><span class="test-meta-sep" aria-hidden="true">·</span>{{end}}<time datetime="{{isoTime .At}}">{{.At.Format "15:04:05"}}</time></p>
    </div>
    <button type="button" class="btn btn-ghost test-dismiss" data-dismiss-test aria-label="Clear test result"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
  <p class="test-stale">The region or a setting changed since this test. Run it again to see the new result.</p>
  {{/* A gated watch: what the gate box read on the same frame, and
       whether that opens the gate (gate.go testGate). A closed gate is
       the verdict too (closedVerdict). */}}
  {{with .Gate}}
  <div class="gate-test{{if .Read}}{{if .Open}} gate-test-open{{else}} gate-test-closed{{end}}{{end}}">
    {{with .Crop}}<figure class="crop-frame gate-crop"><img src="{{.}}" alt="The gate box after preprocessing"></figure>{{end}}
    <p class="gate-line">{{if .Read}}<strong class="gate-state">{{if .Open}}Gate open.{{else}}Gate closed.{{end}}</strong> <span>The gate box read {{if .Text}}<span class="mono gate-read">{{.Text}}</span>{{else}}nothing{{end}}, which {{if .Open}}matches{{else}}doesn't match{{end}} <span class="mono">{{.Pattern}}</span>{{if .Engine}} ({{.Engine}}){{end}}.</span>{{else}}<strong class="gate-state">Gate not read.</strong> <span>{{.Note}}</span>{{end}}</p>
  </div>
  {{end}}
  {{with .Verdict}}
  <p class="verdict verdict-{{.State}}">
    <span class="led {{if eq .State "met"}}led-amber{{else if eq .State "invalid"}}led-error{{else}}led-off{{end}}" aria-hidden="true"></span>
    <span class="verdict-text"><strong class="verdict-title">{{.Title}}</strong> <span class="verdict-detail">{{.Detail}}</span></span>
  </p>
  {{end}}
  {{with .Pixel}}
  {{/* pixel_change: the region in both frames, as the camera sent them.
       Side by side when the panel has room for two, stacked otherwise. */}}
  <div class="crop-pair">
    <figure class="crop-frame">
      <img src="{{$.Crop}}" alt="The region in the first frame">
      <figcaption>First frame</figcaption>
    </figure>
    <figure class="crop-frame">
      <img src="{{.Second}}" alt="The region in the second frame, {{.Gap}} later">
      <figcaption>Second frame, {{.Gap}} later</figcaption>
    </figure>
  </div>
  {{else}}{{if .Crop}}
  {{/* No crop when the Test crashed before it had a frame (testCrashed). */}}
  {{if .Gate}}<p class="crop-label">Value box</p>{{end}}
  <figure class="crop-frame">
    <img src="{{.Crop}}" alt="{{if .Crashed}}The tested region as the camera sent it{{else}}The tested region after preprocessing{{end}}">
  </figure>
  {{end}}{{end}}
  {{if .Read}}
  <dl class="test-facts">
    <dt>Read</dt>
    <dd>{{with .Reading.Placeholder}}<span class="reading-none">{{.}}</span>{{else}}<span class="mono test-reading">{{template "readingText" .Reading}}</span>{{if .Reading.Unreadable}} <span class="reading-sub" aria-hidden="true">no digits read</span>{{end}}{{end}}</dd>
    {{/* No chips for a reading with no digit: its "?" chips would only
         repeat the "?" above at a made-up confidence. The note under the
         list says what to do. */}}
    {{if and .Words (not .Reading.Unreadable)}}
    <dt>Confidence</dt>
    <dd><p class="word-list">{{range .Words}}{{$low := lowConf .Conf}}
      <span class="word-chip {{if $low}}conf-low{{else}}conf-ok{{end}}">{{if $low}}<span class="sr-only">Low confidence: </span>{{end}}{{if and (eq $.Engine "sevenseg") (eq .Text "?")}}<span class="digit-unknown">?</span>{{else}}{{.Text}}{{end}}<span class="conf">{{pct .Conf}}%</span></span>{{end}}
    </p></dd>
    {{end}}
  </dl>
  {{/* A '?' the watch's pattern matches is what the pattern was written
       to catch (the washer's End, the boiler's E4): the box works, so the
       note doesn't tell the user to fix it unless it shows a number. */}}
  {{/* On a frame the gate skips (a blank between phases, another
       phase) the value box isn't what the watch reads, so it gets no
       advice about tightening the region. */}}
  {{if .GateClosed}}
  {{else if .Reading.Matched}}<p class="test-note">{{matchedNote}}</p>
  {{else if .Reading.Partial}}<p class="test-note"><span class="digit-unknown" aria-hidden="true">?</span><span class="sr-only">A question mark</span> marks a digit the seven-segment decoder couldn't read, or read below {{unsureDigit}}% confidence when it could be another digit (its chip shows the digit it saw). Tighten the region around the digits or adjust Binarize.</p>
  {{else if .Reading.Unreadable}}<p class="test-note">The seven-segment decoder couldn't make a digit of anything here. Tighten the region around the digits or adjust Binarize.</p>{{end}}
  {{end}}
  {{with .Note}}<p class="test-note test-note-status"><span class="led {{if $.Crashed}}led-error{{else}}led-off{{end}}" aria-hidden="true"></span><span>{{.}}</span></p>{{end}}
  {{with .NoteDetail}}<details class="tech-detail test-note-detail">
    <summary>Technical detail</summary>
    <p class="tech-raw mono">{{.}}</p>
  </details>{{end}}
</section>
