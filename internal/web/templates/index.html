{{template "head" .}}
<h1>Watches</h1>
<table>
<tr><th>Name</th><th>Trigger</th><th>Interval</th><th>Last reading</th><th></th></tr>
{{range .}}
<tr>
  <td><a href="{{u "/watch/"}}{{.Watch.Name}}">{{.Watch.Name}}</a></td>
  <td>{{.Watch.Trigger.Type}}</td>
  <td>{{dur .Watch.Interval}}</td>
  <td>{{if .Has}}<span {{if .Latest.Fired}}class="fired"{{end}}>{{.Latest.Reading}}</span>{{else}}<span class="muted">no data yet</span>{{end}}</td>
  <td><form method="post" action="{{u "/watch/"}}{{.Watch.Name}}/delete" onsubmit="return confirm('Delete watch {{.Watch.Name}}?')"><button class="danger">delete</button></form></td>
</tr>
{{end}}
</table>
<h2>Add a watch</h2>
<form method="post" action="{{u "/watch/new"}}">
  <input name="name" placeholder="name (e.g. printer-lcd)" required>
  <input name="source" placeholder="http://camera/snapshot.jpg" size="40" required>
  <input type="submit" value="Create">
</form>
{{template "foot" .}}
