{{template "head" .}}
<p><a href="{{u "/"}}">&larr; all watches</a></p>
<h1>{{.Watch.Name}} {{if .Running}}<span class="conf-ok" style="font-size:0.8rem">running</span>{{else}}<span class="conf-low" style="font-size:0.8rem">stopped</span>{{end}}</h1>
<p class="muted">{{.Watch.Source}}</p>
<div class="row">
  <div>
    <div id="stage" data-name="{{.Watch.Name}}" data-base="{{.Base}}">
      <img id="snap" src="{{u "/watch/"}}{{.Watch.Name}}/snapshot" alt="snapshot">
      <canvas id="overlay"></canvas>
    </div>
    <p class="muted">Drag on the image to select the region to watch.</p>
    <div id="test-result"></div>
  </div>
  <div>
    <form id="watchform" method="post" action="{{u "/watch/"}}{{.Watch.Name}}/save">
      <input type="hidden" name="x" value="{{.Watch.Region.X}}">
      <input type="hidden" name="y" value="{{.Watch.Region.Y}}">
      <input type="hidden" name="w" value="{{.Watch.Region.W}}">
      <input type="hidden" name="h" value="{{.Watch.Region.H}}">
      <fieldset>
        <legend>Trigger</legend>
        <label>Type
          <select name="ttype">
            <option value="pixel_change" {{if eq .Watch.Trigger.Type "pixel_change"}}selected{{end}}>pixel_change</option>
            <option value="ocr_match" {{if eq .Watch.Trigger.Type "ocr_match"}}selected{{end}}>ocr_match</option>
            <option value="ocr_changed" {{if eq .Watch.Trigger.Type "ocr_changed"}}selected{{end}}>ocr_changed</option>
            <option value="numeric" {{if eq .Watch.Trigger.Type "numeric"}}selected{{end}}>numeric</option>
          </select>
        </label>
        <label>Pattern <input name="pattern" value="{{.Watch.Trigger.Pattern}}" placeholder="(?i)print complete"></label>
        <label>Op
          <select name="op">
            <option value="" {{if eq .Watch.Trigger.Op ""}}selected{{end}}>-</option>
            <option value="gt" {{if eq .Watch.Trigger.Op "gt"}}selected{{end}}>gt</option>
            <option value="lt" {{if eq .Watch.Trigger.Op "lt"}}selected{{end}}>lt</option>
          </select>
        </label>
        <label>Threshold <input name="tthreshold" type="number" step="any" value="{{.Watch.Trigger.Threshold}}"></label>
        <label>Confirm <input name="confirm" type="number" min="1" value="{{.Watch.Trigger.Confirm}}"></label>
        <label>Cooldown <input name="cooldown" value="{{dur .Watch.Trigger.Cooldown}}"></label>
        <label>Interval <input name="interval" value="{{dur .Watch.Interval}}"></label>
        <label>Max interval <input name="max_interval" value="{{if .Watch.MaxInterval}}{{dur .Watch.MaxInterval}}{{end}}" placeholder="off"></label>
        <label>Health after <input name="health_after" type="number" min="1" value="{{.Watch.HealthAfter}}"></label>
      </fieldset>
      <fieldset>
        <legend>Preprocess (OCR only)</legend>
        <label><input type="checkbox" name="pp_grayscale" {{if .Watch.Preprocess.Grayscale}}checked{{end}}> grayscale</label>
        <label><input type="checkbox" name="pp_invert" {{if .Watch.Preprocess.Invert}}checked{{end}}> invert</label>
        <label>Binarize <input type="range" name="pp_threshold" min="0" max="255" value="{{.Watch.Preprocess.Threshold}}"> <span id="ppt-val"></span></label>
        <label>Upscale
          <select name="pp_upscale">
            <option value="0" {{if lt .Watch.Preprocess.Upscale 2}}selected{{end}}>off</option>
            <option value="2" {{if eq .Watch.Preprocess.Upscale 2}}selected{{end}}>2x</option>
            <option value="3" {{if eq .Watch.Preprocess.Upscale 3}}selected{{end}}>3x</option>
            <option value="4" {{if eq .Watch.Preprocess.Upscale 4}}selected{{end}}>4x</option>
          </select>
        </label>
      </fieldset>
      <fieldset>
        <legend>Notify (one shoutrrr URL per line)</legend>
        <textarea name="notify" rows="3" cols="42">{{range .Watch.Notify}}{{.}}
{{end}}</textarea>
      </fieldset>
      <button type="button" id="testbtn">Test this region</button>
      <input type="submit" value="Save &amp; restart watch">
    </form>
  </div>
</div>
<h2>Live</h2>
<div id="live"><p class="muted">loading…</p></div>
<script src="{{u "/static/app.js"}}"></script>
{{template "foot" .}}
