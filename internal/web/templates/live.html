{{if .Recent}}
{{$latest := index .Recent 0}}
<div class="readout">
  <span class="led {{if $latest.Fired}}led-amber{{else}}led-green{{end}}" aria-hidden="true"></span>
  <span class="readout-label">latest</span>
  <strong class="readout-value mono{{if $latest.Fired}} fired{{end}}">{{$latest.Reading}}</strong>
  <span class="readout-ts mono muted">{{$latest.TS.Format "15:04:05"}}</span>
</div>
<div class="strip">
{{range .Recent}}
  <figure>
    <img src="{{b64png .PNG}}" alt="crop">
    <figcaption {{if .Fired}}class="fired"{{end}}>{{.Reading}}</figcaption>
  </figure>
{{end}}
</div>
{{else}}
<p class="muted">No readings yet.</p>
{{end}}
