name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install runtime tools (integration paths)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Vet and format
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Test
        run: CGO_ENABLED=0 go test ./...
      - name: Race (cgo available here)
        run: go test -race ./internal/state ./internal/supervisor ./internal/hass
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test (no ffmpeg/tesseract - exercises skip paths)
        run: go test ./...
        env:
          CGO_ENABLED: "0"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t watchglass:ci .
      - name: Smoke test container
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          # No config.yaml on purpose: a first start must create it.
          docker run -d --name watchglass-ci \
            --user "$(id -u):$(id -g)" \
            -p 127.0.0.1:18080:8080 \
            -v "$workdir:/config" \
            watchglass:ci
          ok=""
          for i in $(seq 1 20); do
            if curl -fs -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/ | grep -q "^200$"; then
              ok=1
              break
            fi
            sleep 1
          done
          echo "--- container logs ---"
          docker logs watchglass-ci || true
          docker rm -f watchglass-ci
          if [ -z "$ok" ]; then
            echo "::error::watchglass container did not respond with HTTP 200 on / within 20s"
            exit 1
          fi
          echo "watchglass container responded 200 OK"
          if [ ! -f "$workdir/config.yaml" ]; then
            echo "::error::first start did not create config.yaml in the mounted /config"
            exit 1
          fi
          echo "first start created config.yaml"
      - name: Demo mode in a container (no volume, no camera)
        run: |
          set -euo pipefail
          docker run -d --name watchglass-demo -e WATCHGLASS_DEMO=1 \
            -p 127.0.0.1:18081:8080 watchglass:ci
          fired=""
          for i in $(seq 1 75); do
            if curl -fs http://127.0.0.1:18081/watch/demo-printer/live | grep -q 'tag-fired'; then
              fired=1
              break
            fi
            sleep 1
          done
          health=""
          for i in $(seq 1 60); do
            health="$(docker inspect --format '{{.State.Health.Status}}' watchglass-demo)"
            [ "$health" = healthy ] && break
            sleep 1
          done
          echo "--- container logs ---"
          docker logs watchglass-demo || true
          docker rm -f watchglass-demo
          if [ -z "$fired" ]; then
            echo "::error::the built-in demo-printer watch did not fire within 75s"
            exit 1
          fi
          if [ "$health" != healthy ]; then
            echo "::error::container health is $health, want healthy"
            exit 1
          fi
          echo "demo watch fired and the container is healthy"
      - name: Compose file parses
        run: docker compose -f docker-compose.yml config -q
