name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install runtime tools (integration paths)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - name: Vet and format
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Test
        run: CGO_ENABLED=0 go test ./...
      - name: Race (cgo available here)
        run: go test -race ./internal/state ./internal/supervisor ./internal/hass
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test (no ffmpeg/tesseract - exercises skip paths)
        run: go test ./...
        env:
          CGO_ENABLED: "0"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t watchglass:ci .
      - name: Smoke test container
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "watches: []" > "$workdir/config.yaml"
          docker run -d --name watchglass-ci \
            --user "$(id -u):$(id -g)" \
            -p 127.0.0.1:18080:8080 \
            -v "$workdir:/config" \
            watchglass:ci
          ok=""
          for i in $(seq 1 20); do
            if curl -fs -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/ | grep -q "^200$"; then
              ok=1
              break
            fi
            sleep 1
          done
          echo "--- container logs ---"
          docker logs watchglass-ci || true
          docker rm -f watchglass-ci
          if [ -z "$ok" ]; then
            echo "::error::watchglass container did not respond with HTTP 200 on / within 20s"
            exit 1
          fi
          echo "watchglass container responded 200 OK"
