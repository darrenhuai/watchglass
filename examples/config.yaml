# watchglass example: watch a 3D printer's LCD via an HTTP snapshot camera.
#
# The web UI's Save merges into this file rather than rewriting it: the
# comments, key order and quoting below survive a "Save & restart watch",
# and a save that changes nothing leaves the file untouched. What doesn't
# survive the first real change: blank lines may be collapsed, end-of-line
# comments lose their column alignment, a comment at the end of a block may
# shift indentation, and nested blocks in a 4-space file are re-indented. A
# watch deleted or renamed through a save takes its own comments with it; a
# comment block parked above it moves to the next watch.
watches:
  - name: printer-lcd
    # Any URL that returns a JPEG/PNG, or an MJPEG stream (the first frame
    # is read). docs/recipes/camera-urls.md lists the URL by camera brand.
    # A login goes in the URL (http://user:pass@CAMERA-IP/...; Basic and
    # Digest both work). For RTSP cameras, use an rtsp:// source directly —
    # see the instrument-readout watch below.
    source: http://192.168.1.50/snapshot.jpg
    # For an https:// camera with a self-signed certificate:
    # tls_insecure: true
    # Extra request headers, curl -H style, e.g. an API key:
    # headers: ["X-Api-Key: <KEY>"]
    interval: 5s
    # Normalized coordinates (0.0-1.0): this watches the middle strip.
    region: {x: 0.25, y: 0.45, w: 0.5, h: 0.1}
    # Optional OCR preprocessing — tune these in the web UI's live preview:
    # preprocess:
    #   grayscale: true
    #   invert: false      # white-on-black LCDs read better inverted
    #   threshold: 128     # 0 = off; 1-255 binarize at this gray level
    #   upscale: 2         # 0/1 = off; 2-4 for small text
    trigger:
      type: ocr_match
      pattern: "(?i)print complete"
      confirm: 3       # 3 readings in a row must match before it fires (glare protection)
      cooldown: 30m    # don't re-fire within 30 minutes
    notify:
      # One URL per line; the web UI's Send test notification checks them.
      # docs/notifications.md has the forms for Discord, Telegram, email...
      - ntfy://ntfy.sh/my-printer-topic

  - name: printer-motion
    source: http://192.168.1.50/snapshot.jpg
    interval: 10s
    region: {x: 0, y: 0, w: 1, h: 1}
    trigger:
      type: pixel_change
      threshold: 25    # fire when >25% of pixels change
      cooldown: 5m
    notify:
      - ntfy://ntfy.sh/my-printer-topic

  # An RTSP camera pointed at a lab instrument. Needs ffmpeg on PATH.
  # watchglass grabs ONE frame per poll and lets ffmpeg exit — there is no
  # persistent decoder, so idle cost stays near zero.
  - name: instrument-readout
    source: rtsp://192.168.1.60:554/stream1
    interval: 10s
    # Adaptive polling: back off to one check a minute while the readout is
    # unchanging, snap back to 10s the moment it moves. Omit to poll evenly.
    max_interval: 60s
    # Notify after this many consecutive failed grabs (default 3), then once
    # more when the stream recovers.
    health_after: 3
    region: {x: 0.3, y: 0.4, w: 0.4, h: 0.15}
    # A seven-segment LED/LCD readout: the built-in decoder reads it with no
    # tesseract and no preprocessing. Omit engine (or say tesseract) for
    # printed text, one line per watch; say rapidocr for text tesseract
    # misreads or several lines (needs python with
    # `pip install rapidocr onnxruntime`; ~3 s per read).
    engine: sevenseg
    trigger:
      type: numeric
      pattern: "([0-9]+\\.[0-9])"
      op: gt
      threshold: 80.0
      confirm: 3       # readings in a row above 80, not identical readings
      cooldown: 15m
    # How Home Assistant shows the number (the MQTT Value sensor). A
    # device_class needs one of the units HA takes for it; see
    # docs/home-assistant.md.
    unit: "°C"
    device_class: temperature
    notify:
      - ntfy://ntfy.sh/my-lab-topic

# How many days of readings to keep (default 30; -1 = forever). Roughly
# 8 MB/day per watch at a 2s poll interval (scales with interval and watch
# count) — worth knowing before sizing onto e.g. an SD card.
# history_days: 30

# Protect the web UI (recommended before -listen 0.0.0.0):
# auth:
#   username: admin
#   password: change-me

# Optional: publish every watch to Home Assistant via MQTT auto-discovery.
# Each watch appears as a device with Reading, Health, Motion and Snapshot
# entities, plus a Value sensor for numeric watches — no HA YAML needed.
# The top of every page shows whether the broker is connected. Changes to
# this block need a restart. Omit the block to disable.
# mqtt:
#   broker: tcp://homeassistant.local:1883
#   username: watchglass
#   password: secret
