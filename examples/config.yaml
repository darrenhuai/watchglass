# watchglass example: watch a 3D printer's LCD via an HTTP snapshot camera.
#
# WARNING: the web UI's Save button rewrites this entire file via a full
# YAML re-marshal. The comments below, the field order, and the formatting
# will NOT survive the first "Save & restart watch" click, even for watches
# you never touched. Treat this file as copy-paste starting material, not
# as an annotated template that stays annotated — see the README's Web UI
# section for the same warning and the comment-preserving-writer TODO.
watches:
  - name: printer-lcd
    # Any URL that returns a JPEG/PNG. Most IP cameras expose one
    # (e.g. http://CAMERA-IP/snapshot.jpg). For RTSP cameras, use an
    # rtsp:// source directly — see the instrument-readout watch below.
    source: http://192.168.1.50/snapshot.jpg
    interval: 5s
    # Normalized coordinates (0.0-1.0): this watches the middle strip.
    region: {x: 0.25, y: 0.45, w: 0.5, h: 0.1}
    # Optional OCR preprocessing — tune these in the web UI's live preview:
    # preprocess:
    #   grayscale: true
    #   invert: false      # white-on-black LCDs read better inverted
    #   threshold: 128     # 0 = off; 1-255 binarize at this gray level
    #   upscale: 2         # 0/1 = off; 2-4 for small text
    trigger:
      type: ocr_match
      pattern: "(?i)print complete"
      confirm: 3       # require 3 consecutive identical readings (glare protection)
      cooldown: 30m    # don't re-fire within 30 minutes
    notify:
      - ntfy://ntfy.sh/my-printer-topic

  - name: printer-motion
    source: http://192.168.1.50/snapshot.jpg
    interval: 10s
    region: {x: 0, y: 0, w: 1, h: 1}
    trigger:
      type: pixel_change
      threshold: 25    # fire when >25% of pixels change
      cooldown: 5m
    notify:
      - ntfy://ntfy.sh/my-printer-topic

  # An RTSP camera pointed at a lab instrument. Needs ffmpeg on PATH.
  # watchglass grabs ONE frame per poll and lets ffmpeg exit — there is no
  # persistent decoder, so idle cost stays near zero.
  - name: instrument-readout
    source: rtsp://192.168.1.60:554/stream1
    interval: 10s
    # Adaptive polling: back off to one check a minute while the readout is
    # unchanging, snap back to 10s the moment it moves. Omit to poll evenly.
    max_interval: 60s
    # Notify after this many consecutive failed grabs (default 3), then once
    # more when the stream recovers.
    health_after: 3
    region: {x: 0.3, y: 0.4, w: 0.4, h: 0.15}
    trigger:
      type: numeric
      pattern: "([0-9]+\\.[0-9])"
      op: gt
      threshold: 80.0
      confirm: 3
      cooldown: 15m
    notify:
      - ntfy://ntfy.sh/my-lab-topic

# How many days of readings to keep (default 30; -1 = forever). Roughly
# 8 MB/day per watch at a 2s poll interval (scales with interval and watch
# count) — worth knowing before sizing onto e.g. an SD card.
# history_days: 30

# Protect the web UI (recommended before -listen 0.0.0.0):
# auth:
#   username: admin
#   password: change-me

# Optional: publish every watch to Home Assistant via MQTT auto-discovery.
# Each watch appears as a device with reading, health, motion, and snapshot
# entities — no HA YAML needed. Omit the block to disable.
# mqtt:
#   broker: tcp://homeassistant.local:1883
#   username: watchglass
#   password: secret
